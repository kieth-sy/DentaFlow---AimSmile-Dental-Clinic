{% extends 'base.html' %}
{% block title %}Invalid Setup Link · AimSmile{% endblock %}

{% block body %}
<div class="auth-wrap">

    <div class="auth-card text-center">
      <span class="brand-badge mx-auto mb-2"><i class="bi bi-link-45deg"></i></span>

    </div>
  </div>
</div>
{% endblock %}
