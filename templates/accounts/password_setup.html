{% extends 'base.html' %}
{% block title %}Set Password · AimSmile{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="auth-form">
    <div class="auth-card">
      <div class="text-center mb-4">
        <span class="brand-badge mx-auto mb-2"><i class="bi bi-shield-lock"></i></span>
        <h3 class="fw-bold">Set your password</h3>
        <p class="muted">Choose a password to access your AimSmile account.</p>
      </div>
      <form method="post">
        {% csrf_token %}
        {% include 'partials/_form.html' with form=form %}
        <button class="btn-app w-100 justify-content-center" type="submit">
          <i class="bi bi-check2"></i> Save Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
